name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Prek pre-commit hooks
        run: uv run prek run --all-files --hook-stage pre-commit

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Check migration drift
        run: uv run stock_analysis/manage.py makemigrations --check --dry-run

  tests:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stock_analysis
          POSTGRES_USER: stock_analysis
          POSTGRES_PASSWORD: stock_analysis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_analysis -d stock_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_DB: stock_analysis
      POSTGRES_USER: stock_analysis
      POSTGRES_PASSWORD: stock_analysis
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Run migrations
        run: uv run stock_analysis/manage.py migrate --noinput

      - name: Run test suite
        run: uv run stock_analysis/manage.py test stocks investor
