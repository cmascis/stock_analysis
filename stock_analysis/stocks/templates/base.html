{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Stock Analysis{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'stocks/theme.css' %}">
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="grid-lines"></span>
    </div>

    <div class="page-shell">
        <header class="site-header reveal">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark">SA</span>
                <span>Stock Analysis</span>
            </a>

            <div
                class="header-search"
                data-stock-search
                data-search-url="{% url 'stock_search_suggestions' %}"
            >
                <label class="sr-only" for="stock-search-input">Search stocks</label>
                <input
                    id="stock-search-input"
                    type="search"
                    placeholder="Search ticker or company..."
                    autocomplete="off"
                    spellcheck="false"
                    data-search-input
                >
                <div class="search-popover" data-search-results hidden></div>
            </div>

            <nav class="site-nav">
                {% if user.is_authenticated %}
                    <a class="btn btn-ghost" href="{% url 'admin:index' %}">Admin</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-soft" type="submit">Log out</button>
                    </form>
                {% else %}
                    <a class="btn btn-ghost" href="{% url 'login' %}">Log in</a>
                    <a class="btn btn-primary" href="{% url 'signup' %}">Sign up</a>
                {% endif %}
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
    (() => {
      const root = document.querySelector("[data-stock-search]");
      if (!root) {
        return;
      }

      const input = root.querySelector("[data-search-input]");
      const popover = root.querySelector("[data-search-results]");
      const searchUrl = root.dataset.searchUrl;

      let debounceTimer = null;
      let requestController = null;
      let latestResults = [];

      const closePopover = () => {
        popover.hidden = true;
        popover.innerHTML = "";
        root.classList.remove("open");
      };

      const renderPopover = (results) => {
        latestResults = results;
        popover.innerHTML = "";

        if (results.length) {
          const list = document.createElement("ul");
          list.className = "search-result-list";
          results.forEach((item) => {
            const li = document.createElement("li");
            const link = document.createElement("a");
            const ticker = document.createElement("strong");
            ticker.textContent = `${item.ticker} ${item.region}`;
            const company = document.createElement("span");
            company.textContent = item.company_name;
            link.href = item.url;
            link.append(ticker, company);
            li.append(link);
            list.append(li);
          });
          popover.append(list);
        } else {
          const empty = document.createElement("p");
          empty.className = "search-empty";
          empty.textContent = "No matching stocks.";
          popover.append(empty);
        }

        popover.hidden = false;
        root.classList.add("open");
      };

      input.addEventListener("input", () => {
        const query = input.value.trim();
        if (!query) {
          latestResults = [];
          closePopover();
          return;
        }

        clearTimeout(debounceTimer);
        debounceTimer = window.setTimeout(async () => {
          if (requestController) {
            requestController.abort();
          }
          requestController = new AbortController();

          try {
            const response = await fetch(`${searchUrl}?q=${encodeURIComponent(query)}`, {
              signal: requestController.signal,
              headers: {
                "X-Requested-With": "XMLHttpRequest",
              },
            });
            if (!response.ok) {
              latestResults = [];
              closePopover();
              return;
            }

            const payload = await response.json();
            renderPopover(payload.results || []);
          } catch (error) {
            if (error.name !== "AbortError") {
              latestResults = [];
              closePopover();
            }
          }
        }, 160);
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closePopover();
          return;
        }

        if (event.key === "Enter") {
          event.preventDefault();
          const firstResult = latestResults[0];
          if (firstResult && firstResult.url) {
            window.location.href = firstResult.url;
          }
        }
      });

      document.addEventListener("click", (event) => {
        if (!root.contains(event.target)) {
          closePopover();
        }
      });
    })();
    </script>
</body>
</html>
