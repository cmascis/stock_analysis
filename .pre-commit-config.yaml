repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: branch-policy-pre-commit
        name: branch-policy-pre-commit
        entry: scripts/check-branch-policy.sh commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: branch-policy-pre-push
        name: branch-policy-pre-push
        entry: scripts/check-branch-policy.sh push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
