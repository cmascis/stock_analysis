services:
  db:
    image: postgres:17-alpine
    container_name: stock_analysis_db
    environment:
      POSTGRES_DB: stock_analysis
      POSTGRES_USER: stock_analysis
      POSTGRES_PASSWORD: stock_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_analysis_web
    command: >
      sh -c "uv run python stock_analysis/manage.py migrate &&
             uv run python stock_analysis/manage.py runserver 0.0.0.0:8000"
    environment:
      DB_ENGINE: postgres
      POSTGRES_DB: stock_analysis
      POSTGRES_USER: stock_analysis
      POSTGRES_PASSWORD: stock_analysis
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
